name: ❓ Question
description: Ask how to do something with the app.
title: "[Question] "
labels: [question]
body:
  - type: textarea
    id: description
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.6.0"
  - type: textarea
    id: environment
    attributes:
      label: App and system details
      render: text
