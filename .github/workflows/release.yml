name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  web:
    name: Web / PWA bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes for this version
        shell: bash
        run: node scripts/release-notes.mjs "$TAG" > release-notes.md
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm ci --omit=dev --prefix proxy   # database drivers for the gateway
      - name: Package web bundle
        run: |
          mkdir -p out/bangdb-manager-web
          cp -r dist proxy Dockerfile README.md out/bangdb-manager-web/
          cat > out/bangdb-manager-web/RUN.md <<'TXT'
          # BangDB Manager (web build)
          Requires Node.js 22.13+ (SQLite uses the built-in node:sqlite).
              BANGDB_URL=http://<bangdb-host>:18080 GATEWAY_TOKEN=<secret> node proxy/server.mjs
          Then open http://localhost:8080 (phones on the same network: http://<pc-ip>:8080).
          The same server is the gateway for PostgreSQL, MySQL, SQL Server, SQLite, MongoDB and Redis.
          Set GATEWAY_TOKEN whenever other machines can reach the port, and SQLITE_ROOT to the folder holding SQLite files.
          TXT
          (cd out && zip -qr "bangdb-manager-web-${TAG}.zip" bangdb-manager-web)
      - name: Create/update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: BangDB Manager ${{ env.TAG }}
          body_path: release-notes.md
          files: out/bangdb-manager-web-${{ env.TAG }}.zip

  android:
    name: Android APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes for this version
        shell: bash
        run: node scripts/release-notes.mjs "$TAG" > release-notes.md
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npm run build
      - name: Generate Android project
        run: npx cap add android && npx cap sync android
      - name: App icon (launcher and adaptive icons from assets/, see scripts/icon.mjs)
        run: npx --yes @capacitor/assets@3 generate --android --assetPath assets --iconBackgroundColor '#4f8df9' --iconBackgroundColorDark '#4f8df9'
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "bangdb-manager-${TAG}-android-debug.apk"
      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: BangDB Manager ${{ env.TAG }}
          body_path: release-notes.md
          files: bangdb-manager-${{ env.TAG }}-android-debug.apk

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
          - os: macos-latest
            args: --mac
    steps:
      - uses: actions/checkout@v4
      - name: Release notes for this version
        shell: bash
        run: node scripts/release-notes.mjs "$TAG" > release-notes.md
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm ci --omit=dev --prefix proxy   # database drivers for the bundled gateway
      - name: Package with electron-builder
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Attach installers to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: BangDB Manager ${{ env.TAG }}
          body_path: release-notes.md
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/latest*.yml

  # MinaryHub (minaryhub.github.io) lists this repository; ask it to refresh
  # now instead of at its next 3-hourly run. Skipped without the token.
  notify-site:
    name: Refresh MinaryHub site
    needs: [web, android, desktop]
    if: always() && needs.web.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release-published to MinaryHub.github.io
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "SITE_DISPATCH_TOKEN not set — skipped"; exit 0; fi
          gh api repos/MinaryHub/MinaryHub.github.io/dispatches -f event_type=release-published
